name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Java cho Firebase Emulator (test security rules)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Quét secret
        run: npm run check:secrets

      - name: Typecheck
        run: npm run typecheck

      - name: Unit test
        run: npm test

      - name: Test Firestore security rules (emulator)
        run: npm run test:rules

      - name: Build + ngân sách dung lượng
        run: npm run build && npm run check:size
